name: Release

# Builds Mailbun for macOS, Windows, and Linux and publishes the installers
# to a GitHub Release. electron-builder can only build for its host OS, so we
# run one job per platform. Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # Serialize the platforms. electron-builder's GitHub publisher has each
      # job create-or-find the release for the tag; run in parallel they race,
      # the release flips to non-draft mid-run, and later jobs skip their
      # uploads ("existing type not compatible with publishing type"), leaving
      # a release missing assets. One at a time: the first job creates the
      # draft, the rest upload into it, then we publish once all have landed.
      max-parallel: 1
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # OAuth client IDs are baked into release builds. The whole
      # electron/credentials.ts file is stored base64-encoded in the
      # MAILBUN_CREDENTIALS_B64 secret so the IDs never live in the repo.
      # If the secret is unset the build still succeeds — OAuth just shows
      # as unconfigured.
      - name: Restore baked OAuth credentials
        env:
          MAILBUN_CREDENTIALS_B64: ${{ secrets.MAILBUN_CREDENTIALS_B64 }}
        shell: bash
        run: |
          if [ -n "$MAILBUN_CREDENTIALS_B64" ]; then
            echo "$MAILBUN_CREDENTIALS_B64" | openssl base64 -d -A > electron/credentials.ts
            echo "credentials.ts restored from secret"
          else
            echo "no MAILBUN_CREDENTIALS_B64 secret set — OAuth will be unconfigured"
          fi

      - name: Build and publish
        shell: bash
        env:
          # Lets electron-builder create the GitHub Release + upload assets.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --- macOS code signing + notarization (macOS runner only) ---
          # With no cert, electron-builder still tries to auto-discover a
          # signing identity and fails ("<projectDir> not a file"). Disable
          # discovery so unsigned mac builds package cleanly. Remove this once
          # MAC_CSC_LINK is set and you actually want signing.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK == '' && 'false' || '' }}
          # CSC_LINK: base64 of your Developer ID Application .p12
          # CSC_KEY_PASSWORD: the .p12 export password
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # --- Windows code signing (Windows runner only) ---
          # For a legacy .pfx: WIN_CSC_LINK = base64 of the .pfx.
          # New OV/EV certs require a hardware token / cloud HSM — see the
          # signing notes; that path needs a custom sign hook instead.
          WIN_CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: npm run electron:publish
